name: Build & Deploy Spring Boot

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build Application
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Rename Jar
      - name: Rename JAR
        run: |
          JAR_NAME=app_$(date +%Y%m%d_%H%M%S).jar
          mv target/*.jar target/$JAR_NAME
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV

      # Copy Jar to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/${{ env.JAR_NAME }}"
          target: "/home/ec2-user/app"

      # Deploy on EC2
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app/target

            echo "Stopping old application..."
            pkill -f 'java -jar' || true

            echo "Finding latest jar..."
            LATEST_JAR=$(ls -t app_*.jar | head -1)

            echo "Starting $LATEST_JAR ..."
            nohup java -jar "$LATEST_JAR" > app.log 2>&1 &

            sleep 5

            echo "Running Java Processes:"
            ps -ef | grep java

            echo "Keeping latest 2 jars..."
            ls -t app_*.jar | tail -n +3 | xargs -r rm -f

            echo "Deployment Completed Successfully."